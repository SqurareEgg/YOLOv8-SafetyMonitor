{% extends "layout.html" %}

{% block title %}파일 업로드{% endblock %}

{% block content %}
<div class="container">
    <div class="upload-section">
        <h2>파일 업로드</h2>
        <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
            <div class="file-input-container">
                <input type="file" id="fileInput" name="file" accept="image/*,video/*" required>
                <label for="fileInput" class="file-label">파일 선택</label>
            </div>
            <button type="submit" class="upload-btn">업로드</button>
        </form>
        
        <div id="previewContainer" class="preview-container">
            <div class="preview-header">미리보기</div>
            <div id="previewContent"></div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
